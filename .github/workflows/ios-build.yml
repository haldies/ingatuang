name: iOS Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview or production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npx expo install --check

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Tools (Fastlane & CocoaPods)
        run: |
          gem install cocoapods fastlane

      - name: Build iOS App (Local)
        env:
          NODE_OPTIONS: "--no-deprecation"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ISSUER_ID: ${{ secrets.EXPO_APPLE_ISSUER_ID }}
          EXPO_APPLE_KEY_ID: ${{ secrets.EXPO_APPLE_KEY_ID }}
          EXPO_APPLE_API_KEY: ${{ secrets.EXPO_APPLE_API_KEY }}
        run: |
          # Use profile from input if triggered manually, otherwise default to preview
          PROFILE=${{ github.event.inputs.profile || 'preview' }}
          echo "Building with profile: $PROFILE"
          eas build --platform ios --profile $PROFILE --local --non-interactive --output ./build-ios.ipa
          
          # Only submit if it's production
          if [ "$PROFILE" == "production" ]; then
            eas submit --platform ios --latest --profile production --non-interactive
          fi

      - name: Upload Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ./build-ios.ipa
